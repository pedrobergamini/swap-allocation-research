[project]
name = "warm-starts"
version = "0.1.0"
description = "Dataset preparation, training, evaluation and reporting for swap-allocation-research"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "numpy",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
# Seven-day minimum age for every resolved package. Move deliberately, never to "now".
exclude-newer = "2026-09-15T00:00:00Z"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/warm_starts"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
