<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="learned-warm-starts-complete-solve-performance-1200-680-title learned-warm-starts-complete-solve-performance-1200-680-desc"><title id="learned-warm-starts-complete-solve-performance-1200-680-title">Learned warm starts: complete-solve performance</title><desc id="learned-warm-starts-complete-solve-performance-1200-680-desc">About 5.3 times faster median complete solves on eligible two-pool orders; 56.5% less total time across the full fresh benchmark. Both compare learned warm starts with checked refinement skipping against the Fynd reference.</desc><rect width="1200" height="680" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif}</style><path d="M40 30h22M40 30v22" fill="none" stroke="#111111"/><text x="58" y="65" font-size="15" font-weight="700" fill="#616161">SWAP ALLOCATION RESEARCH</text><text x="58" y="119" font-size="39" font-weight="700" fill="#111111">Less work for the numerical solver</text><text x="58" y="160" font-size="24" font-weight="400" fill="#616161">Learned warm starts with checked refinement skipping</text><rect x="58" y="202" width="542" height="302" fill="#111111"/><path d="M600 202H1142V504H600" fill="none" stroke="#111111"/><text x="86" y="315" font-size="96" font-weight="700" fill="#ffffff">≈5.3×</text><text x="86" y="364" font-size="26" font-weight="600" fill="#ffffff">faster at the median</text><text x="86" y="427" font-size="23" font-weight="400" fill="#c9c9c9">Complete solves on eligible</text><text x="86" y="461" font-size="23" font-weight="400" fill="#c9c9c9">two-pool orders</text><text x="632" y="315" font-size="90" font-weight="700" fill="#111111">56.5%</text><text x="632" y="364" font-size="26" font-weight="600" fill="#111111">less total solve time</text><text x="632" y="427" font-size="23" font-weight="400" fill="#616161">Across the full benchmark,</text><text x="632" y="461" font-size="23" font-weight="400" fill="#616161">including declined orders</text><text x="58" y="555" font-size="24" font-weight="600" fill="#111111">Both measured against the Fynd reference</text><text x="58" y="597" font-size="20" font-weight="400" fill="#616161">Fresh benchmark · 1,440 orders · 3 repeats · frozen weights</text><text x="58" y="638" font-size="19" font-weight="400" fill="#616161">Complete-solve timing includes inference, checks and remaining refinement.</text></svg>
