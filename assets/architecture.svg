<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="learned-warm-starts-and-a-separate-codex-experiment-harness-1200-900-title learned-warm-starts-and-a-separate-codex-experiment-harness-1200-900-desc"><title id="learned-warm-starts-and-a-separate-codex-experiment-harness-1200-900-title">Learned warm starts and a separate Codex experiment harness</title><desc id="learned-warm-starts-and-a-separate-codex-experiment-harness-1200-900-desc">Within Fynd, a neural allocation initializer proposes a starting split. An allocation-regret estimator screens it for a numerical refinement skip check. Fynd refines when needed and selects the final result. Separately, Codex proposes bounded recipes for supervised training and validation. The frozen release and final test remain separate.</desc><rect width="1200" height="900" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif}</style><path d="M40 30h22M40 30v22" fill="none" stroke="#111111"/><text x="58" y="60" font-size="15" font-weight="700" fill="#616161">SWAP ALLOCATION RESEARCH</text><text x="58" y="111" font-size="39" font-weight="700" fill="#111111">Learned warm starts inside Fynd</text><text x="58" y="153" font-size="23" font-weight="400" fill="#616161">The networks propose. Numerical checks decide when to skip refinement.</text><path d="M58 190H1142" stroke="#111111"/><text x="58" y="226" font-size="16" font-weight="700" fill="#111111">FROZEN METHOD · COMPLETE-SOLVE RUNTIME</text><rect x="58" y="250" width="244" height="194" fill="#111111" stroke="#111111"/><text x="74" y="286" font-size="21" font-weight="700" fill="#ffffff">Neural allocation</text><text x="74" y="315" font-size="21" font-weight="700" fill="#ffffff">initializer</text><path d="M74 337h212" stroke="#cccccc" stroke-width="0.5"/><text x="74" y="374" font-size="18" font-weight="400" fill="#cccccc">Coarse split + learned</text><text x="74" y="402" font-size="18" font-weight="400" fill="#cccccc">correction</text><rect x="338" y="250" width="244" height="194" fill="#111111" stroke="#111111"/><text x="354" y="286" font-size="21" font-weight="700" fill="#ffffff">Allocation-regret</text><text x="354" y="315" font-size="21" font-weight="700" fill="#ffffff">estimator</text><path d="M354 337h212" stroke="#cccccc" stroke-width="0.5"/><text x="354" y="374" font-size="18" font-weight="400" fill="#cccccc">Screens the proposal</text><text x="354" y="402" font-size="18" font-weight="400" fill="#cccccc">for the skip check</text><rect x="618" y="250" width="244" height="194" fill="#ffffff" stroke="#111111"/><text x="634" y="286" font-size="21" font-weight="700" fill="#111111">Refinement</text><text x="634" y="315" font-size="21" font-weight="700" fill="#111111">skip check</text><path d="M634 337h212" stroke="#616161" stroke-width="0.5"/><text x="634" y="374" font-size="18" font-weight="400" fill="#616161">Neighboring quotes</text><text x="634" y="402" font-size="18" font-weight="400" fill="#616161">bound gross output</text><rect x="898" y="250" width="244" height="194" fill="#ffffff" stroke="#111111"/><text x="914" y="286" font-size="21" font-weight="700" fill="#111111">Fynd</text><text x="914" y="315" font-size="21" font-weight="700" fill="#111111">refinement</text><path d="M914 337h212" stroke="#616161" stroke-width="0.5"/><text x="914" y="374" font-size="18" font-weight="400" fill="#616161">Refines when needed;</text><text x="914" y="402" font-size="18" font-weight="400" fill="#616161">selects the final result</text><path d="M308 346h24m-8-7 8 7-8 7" fill="none" stroke="#111111" stroke-width="2"/><path d="M588 346h24m-8-7 8 7-8 7" fill="none" stroke="#111111" stroke-width="2"/><path d="M868 346h24m-8-7 8 7-8 7" fill="none" stroke="#111111" stroke-width="2"/><text x="58" y="489" font-size="20" font-weight="400" fill="#616161">If initialization or skip screening declines, the solve continues through Fynd.</text><path d="M58 538H1142" stroke="#111111" stroke-dasharray="4 5"/><text x="58" y="584" font-size="16" font-weight="700" fill="#111111">CODEX EXPERIMENT HARNESS · SEPARATE TRAINING TRIAL</text><rect x="58" y="610" width="326" height="113" fill="#f4f4f4"/><path d="M58 610h326" stroke="#111111" stroke-width="2"/><text x="78" y="650" font-size="24" font-weight="600" fill="#111111">Codex proposes</text><text x="78" y="690" font-size="18" font-weight="400" fill="#616161">A bounded training recipe</text><rect x="437" y="610" width="326" height="113" fill="#f4f4f4"/><path d="M437 610h326" stroke="#111111" stroke-width="2"/><text x="457" y="650" font-size="24" font-weight="600" fill="#111111">Local code trains</text><text x="457" y="690" font-size="18" font-weight="400" fill="#616161">User-supplied prepared data</text><rect x="816" y="610" width="326" height="113" fill="#f4f4f4"/><path d="M816 610h326" stroke="#111111" stroke-width="2"/><text x="836" y="650" font-size="24" font-weight="600" fill="#111111">Local code evaluates</text><text x="836" y="690" font-size="18" font-weight="400" fill="#616161">Validation results + timings</text><path d="M395 667h30m-8-7 8 7-8 7" fill="none" stroke="#111111" stroke-width="2"/><path d="M774 667h30m-8-7 8 7-8 7" fill="none" stroke="#111111" stroke-width="2"/><text x="58" y="778" font-size="22" font-weight="600" fill="#111111">Candidate trials do not replace the frozen method or use its final test.</text><text x="58" y="821" font-size="21" font-weight="400" fill="#616161">The connected trial came after the original model development.</text><text x="58" y="859" font-size="19" font-weight="400" fill="#616161">Reusable autonomous orchestration remains in progress.</text></svg>
