<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="complete-solve-time-relative-to-fynd-1200-740-title complete-solve-time-relative-to-fynd-1200-740-desc"><title id="complete-solve-time-relative-to-fynd-1200-740-title">Complete-solve time relative to Fynd</title><desc id="complete-solve-time-relative-to-fynd-1200-740-desc">Aggregate complete-solve time ratios on the fresh benchmark. Lower is faster. This is timing after the model freeze, separate from the held-out quality test.</desc><rect width="1200" height="740" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif}</style><path d="M40 30h22M40 30v22" fill="none" stroke="#111111"/><text x="64" y="66" font-size="15" font-weight="700" fill="#616161">SWAP ALLOCATION RESEARCH</text><text x="64" y="122" font-size="39" font-weight="700" fill="#111111">Comparing initialization methods</text><text x="64" y="162" font-size="22" font-weight="400" fill="#616161">Complete-solve time / Fynd reference · lower is faster</text><path d="M64 190H1136" stroke="#111111"/><text x="64" y="249" font-size="21" font-weight="600" fill="#111111">Fynd reference</text><rect x="385" y="222" width="570" height="38" fill="#f0f0f0"/><rect x="385" y="222" width="570.000" height="38" fill="#b3b3b3"/><text x="979" y="250" font-size="26" font-weight="700" fill="#111111">1.000×</text><text x="64" y="328" font-size="21" font-weight="600" fill="#111111">Coarse + refinement</text><rect x="385" y="301" width="570" height="38" fill="#f0f0f0"/><rect x="385" y="301" width="271.201" height="38" fill="#888888"/><text x="979" y="329" font-size="26" font-weight="700" fill="#111111">0.476×</text><text x="64" y="407" font-size="21" font-weight="600" fill="#111111">Learned + refinement</text><rect x="385" y="380" width="570" height="38" fill="#f0f0f0"/><rect x="385" y="380" width="256.008" height="38" fill="#7594cb"/><text x="979" y="408" font-size="26" font-weight="700" fill="#111111">0.449×</text><text x="64" y="486" font-size="21" font-weight="600" fill="#111111">Learned + checked skip</text><rect x="385" y="459" width="570" height="38" fill="#f0f0f0"/><rect x="385" y="459" width="247.722" height="38" fill="#2563eb"/><text x="979" y="487" font-size="26" font-weight="700" fill="#111111">0.435×</text><path d="M64 554H1136" stroke="#111111"/><text x="64" y="596" font-size="22" font-weight="600" fill="#111111">Learned initialization cuts total solve time by 5.6% vs coarse.</text><text x="64" y="632" font-size="21" font-weight="400" fill="#616161">With checked refinement skipping, the reduction reaches 8.7%.</text><text x="64" y="687" font-size="17" font-weight="400" fill="#616161">Fresh benchmark · 4,320 solves · 1,440 unique orders · 3 repeats</text></svg>
